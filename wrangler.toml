name = "gym-planner"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Интерфейс Mini App (папка webapp/) раздаётся как статические файлы.
# Запросы на /api/* и /webhook сначала попадают в Worker.
[assets]
directory = "./webapp"
binding = "ASSETS"
run_worker_first = ["/api/*", "/webhook"]

# Cron каждую минуту: вечернее уведомление и удаление старых сообщений бота
[triggers]
crons = ["* * * * *"]

# Логи Worker (console.log/error, ошибки cron) доступны в панели Cloudflare и через `wrangler tail`
[observability]
enabled = true

[vars]
TZ = "Europe/Chisinau"
ENABLE_ID_COMMAND = "true"
# Администраторы (Telegram ID через запятую). Рекомендуется хранить в секретах: `wrangler secret put ADMIN_ID`.
# Им доступны команды бота (/admin) и админ-панель в Mini App: выбор тренера, добавление, правка и удаление его записей.
# Доступ тренерам выдаётся только администратором: /adduser выдаёт, /ban закрывает, /unban возвращает.
ADMIN_ID = "YOUR_ADMIN_TELEGRAM_ID"
TURSO_URL = "libsql://gymplanner-db.aws-eu-west-1.turso.io"
# Адрес вашего Worker (с https:// и слэшем в конце):
APP_URL = "https://gym-planner.your-subdomain.workers.dev"

# Секреты (задаются через wrangler secret put):
#   wrangler secret put BOT_TOKEN
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put TURSO_AUTH_TOKEN
