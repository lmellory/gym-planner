name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Деплой не отменяет предыдущий: две одновременные выкладки в один воркер бессмысленны
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Проверки дублируются намеренно: в прод не должен уехать сломанный код,
      # даже если CI-прогон на этом коммите почему-то не запускался.
      - run: npm run typecheck
      - run: npm test
      - run: npm run version-assets

      - name: Deploy to Cloudflare Workers
        id: deploy
        # Секрет кладётся в env, а проверка идёт по env: secrets нельзя писать прямо в if
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Секрет не настроен
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::notice title=Деплой пропущен::Не задан секрет CLOUDFLARE_API_TOKEN."
          echo "Settings -> Secrets and variables -> Actions -> New repository secret"
          echo "Имя: CLOUDFLARE_API_TOKEN, значение: токен Cloudflare (шаблон Edit Cloudflare Workers)."
